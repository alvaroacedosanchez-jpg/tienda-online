<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Piquantum">
  <title>Piquantum</title>
  <!-- Fondo: círculo crema para que la guindilla se vea en pestañas claras y oscuras -->
  <circle cx="32" cy="32" r="31" fill="#fff4e6"/>
  <!-- Guindilla roja, curvada -->
  <path d="M40 17c6 3 8 10 5 18-4 11-14 18-26 19-3 0-4-2-2-4 8-5 13-11 15-19 1-5 3-11 8-14z" fill="#d7261e"/>
  <!-- Brillo -->
  <path d="M41 22c2 2 2 6 1 9" fill="none" stroke="#ff8a7a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rabito verde -->
  <path d="M40 17c1-4 4-7 8-8" fill="none" stroke="#2f8a3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M35 18c2-3 7-4 11-1-3 2-7 3-11 1z" fill="#2f8a3a"/>
</svg>
